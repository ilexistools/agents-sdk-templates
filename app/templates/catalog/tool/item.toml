# Item manifest. Full standard: docs/catalog-standards.md
id = "__ID__"
type = "tool"
title = "__TITLE__"                      # up to 40 characters, short noun phrase
description = "Describe in one sentence what the tool does."  # up to 120 characters, starts with a verb
icon = "🧩"                             # one emoji
category = "General"                     # groups items in the dashboard
version = "0.1.0"                        # SemVer; bump it when Input/Output changes
tags = []                                # up to 6 lowercase keywords
requires = []                            # required settings, e.g. ["OPENAI_API_KEY"]
channels = ["api", "cli", "mcp"]

[[examples]]
title = "Basic example"
input = { text = "one two three" }
output = { result = "one two three" }    # optional; checked by the tests when present
