# Item manifest. Full standard: docs/catalog-standards.md
id = "__ID__"
type = "agent"
title = "__TITLE__"                      # up to 40 characters, short noun phrase
description = "Describe in one sentence what the agent does."  # up to 120 characters, starts with a verb
icon = "🤖"                             # one emoji
category = "General"                     # groups items in the dashboard
version = "0.1.0"                        # SemVer; bump it when Input/Output changes
tags = ["llm"]                           # up to 6 lowercase keywords
requires = []                            # extra settings; the model provider key is checked automatically
channels = ["api", "cli", "mcp"]

[[examples]]
title = "Basic example"
input = { text = "Sample text." }
# LLM outputs vary; omit output or use it only as an illustration.
