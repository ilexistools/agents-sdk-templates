id = "word_count"
type = "tool"
title = "Word counter"
description = "Counts words and non-whitespace characters in a text."
icon = "🔢"
category = "Text"
version = "1.1.0"
tags = ["text", "offline"]
requires = []
channels = ["api", "cli", "mcp"]

[[examples]]
title = "Short sentence"
input = { text = "one two three" }
output = { word_count = 3, character_count = 11 }

[[examples]]
title = "Extra spaces and line breaks"
input = { text = "  hello   world\nagain  " }
output = { word_count = 3, character_count = 15 }
